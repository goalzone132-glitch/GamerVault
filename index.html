<!DOCTYPE html>
<html lang="en">
<head>
<!-- Adsterra Social Bar Script -->
    <script src="https://pl31618835.profitableratecpmnetwork.com/94/dd/a8/94dda8264e68850a185fcc1d5cf28543.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<title>GamerVault</title>
<style>
:root{--bg:#0a0c13;--panel:#131726;--panel2:#1a1f33;--line:#262d4a;--cy:#22e5ff;--vi:#7c3aed;--tx:#e8ecff;--mu:#8b94b8;--red:#ff5d7a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;padding-bottom:110px;background:radial-gradient(800px 380px at 90% -8%,#2b166366,transparent),var(--bg);color:var(--tx);font:15px/1.45 "Bahnschrift","Segoe UI",Roboto,system-ui,sans-serif}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{display:flex;align-items:center;gap:10px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:12px}
.logo{color:var(--cy);filter:drop-shadow(0 0 8px #22e5ffaa);display:flex}
.brand{flex:1;min-width:0}
h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:.02em;text-shadow:0 0 14px #7c3aed99}
#count{margin:2px 0 0;color:var(--mu);font-size:13px}
.sbar{position:sticky;top:0;z-index:5;background:#0a0c13ee;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);display:flex;pointer-events:none}
.search input{padding-left:40px}
input,select{width:100%;min-width:0;background:#0d1020;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#5b6488}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px #22e5ff22,0 0 16px #22e5ff30}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cy) 50%),linear-gradient(135deg,var(--cy) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{width:100%;background:#0d1020;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:13px/1.4 ui-monospace,Consolas,monospace;resize:vertical;outline:none}
textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px #22e5ff22,0 0 16px #22e5ff30}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:box-shadow .15s,transform .1s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:40px;padding:8px 11px;font-size:14px}
.btn.danger{color:var(--red);border-color:#ff5d7a44;background:#ff5d7a10}
.btn.big{width:100%;border:0;color:#fff;background:linear-gradient(90deg,var(--vi),#0aa9c9);box-shadow:0 0 18px #7c3aed55}
.btn.big:active{box-shadow:0 0 26px #22e5ff88}
@media(hover:hover){.btn:hover{border-color:var(--cy);box-shadow:0 0 12px #22e5ff33}.copy:hover{box-shadow:0 0 12px #22e5ff66}}
#list{display:grid;gap:14px;padding-top:14px}
.card{background:linear-gradient(160deg,var(--panel),#0f1322);border:1px solid var(--line);border-left:3px solid var(--vi);border-radius:16px;padding:12px;box-shadow:0 6px 24px #0006}
.head{display:flex;gap:8px;align-items:center}
.name{font-size:18px;font-weight:700;letter-spacing:.01em}
.icon{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.icon svg{transition:transform .2s}
.collapsed .icon svg{transform:rotate(-90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mu)}
.chip.vi{color:#c4b0ff;border-color:#7c3aed88;background:#7c3aed22}
.body{display:grid;gap:12px;margin-top:10px}
.collapsed .body{display:none}
.meta,.pgrid{display:grid;gap:10px}
.players{display:grid;gap:10px}
.player{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0c0f1d;display:grid;gap:8px}
.plabel{background:transparent;border:0;border-bottom:1px dashed #22e5ff55;border-radius:0;padding:4px 2px;color:var(--cy);font-weight:700;font-size:16px}
.plabel:focus{box-shadow:none;border-bottom-color:var(--cy)}
.field label{display:block;font-size:13px;color:var(--mu);margin:0 0 4px 2px}
.row{display:flex;gap:8px}
.copy{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid #22e5ff55;background:#22e5ff12;color:var(--cy);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s,transform .1s}
.copy:active{transform:scale(.92)}
.copy.done{background:var(--cy);color:#00161c;box-shadow:0 0 18px #22e5ffaa}
.foot{display:grid;gap:8px}
.empty{text-align:center;color:var(--mu);padding:48px 20px;border:1px dashed var(--line);border-radius:16px}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;padding:0 20px;min-height:52px;display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;color:#00161c;background:var(--cy);box-shadow:0 0 22px #22e5ff88,0 6px 18px #0009;cursor:pointer}
.fab:active{transform:scale(.96)}
#toast{position:fixed;left:50%;bottom:96px;z-index:20;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#0d1020;color:var(--tx);border:1px solid var(--cy);border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 0 20px #22e5ff55;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.warn{border-color:var(--red);box-shadow:0 0 20px #ff5d7a55}
.ov{position:fixed;inset:0;z-index:10;background:#04050ac0;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));display:grid;gap:14px;animation:up .22s ease-out;box-shadow:0 -8px 40px #7c3aed44}
.sheet h2{margin:0;font-size:19px}
.sheet p{margin:0;color:var(--mu)}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:#0d1020;color:var(--mu);border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{color:#fff;border-color:var(--cy);background:#7c3aed44;box-shadow:0 0 12px #22e5ff44}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:560px){.pgrid,.meta{grid-template-columns:1fr 1fr}.ov{align-items:center}.sheet{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ১. প্লাস (FAB) বাটনকে ব্যানার অ্যাডের উপরে তোলা */
.fab, #fab, [class*="fab"], [class*="add"] {
  bottom: 75px !important; /* ব্যানার অ্যাডের উচ্চতার উপরে ফিক্স করার জন্য */
}

/* ২. মোডাল বা পপআপ বক্সকে ওপরে তুলে বাটন দৃশ্যমান করা */
.modal, .dialog, [class*="modal"], [class*="dialog"] {
  margin-bottom: 70px !important;
}

/* ৩. মোডালের ভেতরে যেন স্ক্রোল করে Create squad বাটন দেখা যায় */
.modal-content, [class*="modal-card"] {
  max-height: 80vh !important;
  overflow-y: auto !important;
  padding-bottom: 20px !important;
}
/* মোবাইলে স্ক্রিন ছোট হওয়া ও কিবোর্ড উঠলে মোডাল অ্যাড্রেস ফিক্স */
@media screen and (max-width: 600px) {
  /* পুরো ব্যাকড্রপ/মোডাল কন্টেইনার নিচে জায়গা ছাড়বে */
  div[class*="modal"], div[id*="modal"], div[role="dialog"] {
    align-items: flex-start !important;
    padding-top: 20px !important;
    padding-bottom: 90px !important;
  }

  /* মোডালের ভেতরের মূল বক্স সংকুচিত হয়ে স্ক্রোলিং সক্রিয় করবে */
  div[class*="modal"] > div, div[id*="modal"] > div, .modal-card, .modal-content {
    max-height: calc(100vh - 160px) !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch !important;
  }
}
</style>
</head>
<body>
<header class="wrap top">
  <span class="logo" id="logo"></span>
  <div class="brand"><h1>GamerVault</h1><p id="count"></p></div>
  <button class="btn sm" id="exp" title="Export squad data as JSON"></button>
  <button class="btn sm" id="imp" title="Import JSON data"></button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<div class="sbar"><div class="wrap"><div class="search"><span id="sIc"></span>
  <input id="q" type="search" placeholder="Search squads or player names" autocomplete="off" aria-label="Search squads or player names"></div></div></div>
<main class="wrap" id="list"></main>
<button class="fab" id="add"></button>
<div id="toast" role="status" aria-live="polite"></div>
<div class="ov" id="ov" hidden></div>
<datalist id="games"><option value="Free Fire"><option value="Free Fire MAX"><option value="PUBG Mobile"><option value="BGMI"><option value="COD Mobile"><option value="Mobile Legends"></datalist>

<script>
(function(){
'use strict';
var KEY='gamervault.v1';
var MODES={solo:{n:1,label:'Solo'},duo:{n:2,label:'Duo'},squad4:{n:4,label:'Squad (4)'},squad5:{n:5,label:'Squad (5)'}};
var IC={
copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
check:'<path d="M4 12l5 5 11-11"/>',
chev:'<path d="M6 9l6 6 6-6"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
logo:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M8 10l4 6 4-6"/>'};
function svg(n,s){s=s||20;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';}
function $(s){return document.querySelector(s);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function str(v){return typeof v==='string'?v.slice(0,300):typeof v==='number'?String(v):'';}
function newId(){return 'sq_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function defLabel(i){return i===0?'Captain':'Player '+(i+1);}
function blank(i){return {label:defLabel(i),ign:'',uid:'',phone:'',extra:''};}
function mkPlayers(mode){var a=[];for(var i=0;i<MODES[mode].n;i++)a.push(blank(i));return a;}
function clean(s){
  if(!s||typeof s!=='object')return null;
  var ps=Array.isArray(s.players)?s.players.slice(0,5):[];
  var mode=MODES[s.mode]?s.mode:'squad4';
  if(ps.length>MODES[mode].n)mode=ps.length<=2?'duo':ps.length<=4?'squad4':'squad5';
  var r={id:str(s.id)||newId(),name:str(s.name),game:str(s.game),mode:mode,collapsed:!!s.collapsed,players:[]};
  for(var i=0;i<MODES[mode].n;i++){var p=ps[i]&&typeof ps[i]==='object'?ps[i]:{};
    r.players.push({label:str(p.label)||defLabel(i),ign:str(p.ign),uid:str(p.uid),phone:str(p.phone),extra:str(p.extra)});}
  return r;
}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d.map(clean).filter(Boolean):[];}catch(e){return [];}}
var squads=load(),query='',fid=0,tmr=null,toastT=null,onClose=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(squads));}catch(e){toast('Could not save. Storage is full or blocked.',true);}}
function saveSoon(){clearTimeout(tmr);tmr=setTimeout(save,250);}
function flush(){clearTimeout(tmr);save();}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});

/* toast + clipboard */
function toast(m,warn){var t=$('#toast');t.textContent=m;t.className='show'+(warn?' warn':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},1700);}
function copyText(t){
  var p=(navigator.clipboard&&window.isSecureContext)?navigator.clipboard.writeText(t).then(function(){return true;},function(){return false;}):Promise.resolve(false);
  return p.then(function(ok){
    if(ok)return true;
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
    var r=false;try{r=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);return r;
  });
}
function copyBtn(get,msg){
  var b=el('button','copy');b.type='button';b.innerHTML=svg('copy');b.setAttribute('aria-label',msg.replace(' copied!','').replace(/^/,'Copy '));
  b.onclick=function(){
    var v=get().trim();
    if(!v){toast('Nothing to copy yet',true);return;}
    copyText(v).then(function(ok){
      if(!ok){toast('Copy blocked. Select the text and copy it manually.',true);return;}
      toast(msg);b.classList.add('done');b.innerHTML=svg('check');
      clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('done');b.innerHTML=svg('copy');},1100);
    });
  };
  return b;
}

/* modal */
function modal(node){var o=$('#ov');onClose=null;o.textContent='';o.appendChild(node);o.hidden=false;o.onclick=function(e){if(e.target===o)closeModal();};}
function closeModal(){var o=$('#ov');o.hidden=true;o.textContent='';if(onClose){var f=onClose;onClose=null;f();}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#ov').hidden)closeModal();});
function ask(msg,okLabel){
  return new Promise(function(res){
    var s=el('div','sheet'),a=el('div','acts'),no=el('button','btn','Cancel'),ok=el('button','btn danger',okLabel);
    no.type=ok.type='button';
    s.append(el('h2',null,'Are you sure?'),el('p',null,msg));
    no.onclick=closeModal;
    ok.onclick=function(){onClose=null;closeModal();res(true);};
    a.append(no,ok);s.appendChild(a);modal(s);onClose=function(){res(false);};
  });
}

/* building blocks */
function field(label,val,set,o){
  o=o||{};
  var w=el('div','field'),l=el('label',null,label),r=el('div','row'),i=el('input'),id='f'+(++fid);
  i.id=id;l.htmlFor=id;i.type=o.type||'text';i.value=val;i.placeholder=o.ph||'';
  i.autocomplete='off';i.setAttribute('autocapitalize','off');i.spellcheck=false;
  if(o.list)i.setAttribute('list',o.list);
  i.addEventListener('input',function(){set(i.value);saveSoon();});
  r.appendChild(i);
  if(!o.nocopy)r.appendChild(copyBtn(function(){return i.value;},o.toast||label+' copied!'));
  w.append(l,r);return w;
}
function squadText(s){
  var L=['Squad: '+(s.name.trim()||'Unnamed')];
  if(s.game.trim())L.push('Game: '+s.game.trim());
  L.push('Mode: '+MODES[s.mode].label);
  s.players.forEach(function(p,i){
    L.push('',p.label.trim()||defLabel(i));
    [['IGN',p.ign],['UID',p.uid],['Phone',p.phone],['Info',p.extra]].forEach(function(x){if(x[1].trim())L.push(x[0]+': '+x[1].trim());});
  });
  return L.join('\n');
}
function resize(s){var n=MODES[s.mode].n;while(s.players.length<n)s.players.push(blank(s.players.length));s.players.length=n;}

function buildCard(s){
  var c=el('article','card'+(s.collapsed?' collapsed':''));
  var h=el('div','head'),nm=el('input','name');
  nm.value=s.name;nm.placeholder='Squad name';nm.setAttribute('aria-label','Squad name');nm.autocomplete='off';
  nm.oninput=function(){s.name=nm.value;saveSoon();};
  var tg=el('button','icon');tg.type='button';tg.innerHTML=svg('chev');
  tg.setAttribute('aria-label','Expand or collapse squad');tg.setAttribute('aria-expanded',String(!s.collapsed));
  tg.onclick=function(){s.collapsed=!s.collapsed;c.classList.toggle('collapsed',s.collapsed);tg.setAttribute('aria-expanded',String(!s.collapsed));save();};
  h.append(nm,copyBtn(function(){return nm.value;},'Squad name copied!'),tg);
  var chips=el('div','chips'),cg=el('span','chip'),cm=el('span','chip vi');
  function upd(){cg.textContent=s.game.trim()||'No game set';cm.textContent=MODES[s.mode].label;}
  upd();chips.append(cg,cm);

  var b=el('div','body'),meta=el('div','meta');
  meta.appendChild(field('Game',s.game,function(v){s.game=v;upd();},{ph:'Free Fire, PUBG Mobile...',list:'games',toast:'Game copied!'}));
  var mw=el('div','field'),ml=el('label',null,'Mode'),sel=el('select'),sid='m'+(++fid);
  sel.id=sid;ml.htmlFor=sid;
  Object.keys(MODES).forEach(function(k){var o=el('option',null,MODES[k].label);o.value=k;sel.appendChild(o);});
  sel.value=s.mode;
  sel.onchange=function(){
    var n=MODES[sel.value].n,lost=s.players.slice(n).filter(function(p){return p.ign||p.uid||p.phone||p.extra;}).length;
    function apply(){s.mode=sel.value;resize(s);save();c.replaceWith(buildCard(s));}
    if(!lost){apply();return;}
    ask('Switching to '+MODES[sel.value].label+' removes '+lost+' filled player slot'+(lost>1?'s':'')+'.','Remove slots').then(function(ok){if(ok)apply();else sel.value=s.mode;});
  };
  mw.append(ml,sel);meta.appendChild(mw);

  var pl=el('div','players');
  s.players.forEach(function(p,i){
    var d=el('section','player'),lab=el('input','plabel'),g=el('div','pgrid');
    lab.value=p.label;lab.placeholder=defLabel(i);lab.setAttribute('aria-label','Player slot label');lab.autocomplete='off';
    lab.oninput=function(){p.label=lab.value;saveSoon();};
    g.append(
      field('In-game name (IGN)',p.ign,function(v){p.ign=v;},{toast:'IGN copied!'}),
      field('Game UID / Player ID',p.uid,function(v){p.uid=v;},{toast:'UID copied!'}),
      field('WhatsApp / Phone',p.phone,function(v){p.phone=v;},{type:'tel',toast:'Phone copied!'}),
      field('Email / NID / Extra (optional)',p.extra,function(v){p.extra=v;},{toast:'Info copied!'})
    );
    d.append(lab,g);pl.appendChild(d);
  });

  var f=el('div','foot'),all=el('button','btn big'),del=el('button','btn danger');
  all.type=del.type='button';
  all.innerHTML=svg('copy')+'<span>Copy all squad info</span>';
  del.innerHTML=svg('trash',18)+'<span>Delete squad</span>';
  all.onclick=function(){copyText(squadText(s)).then(function(ok){toast(ok?'Squad info copied!':'Copy blocked by this browser',!ok);});};
  del.onclick=function(){
    ask('Delete "'+(s.name.trim()||'this squad')+'"? This cannot be undone.','Delete squad').then(function(ok){
      if(!ok)return;squads=squads.filter(function(x){return x!==s;});save();render();toast('Squad deleted');
    });
  };
  f.append(all,del);
  b.append(meta,pl,f);
  c.append(h,chips,b);
  return c;
}

function render(){
  var q=query.trim().toLowerCase(),list=$('#list');list.textContent='';
  var hit=squads.filter(function(s){
    if(!q)return true;
    return [s.name,s.game].concat(s.players.map(function(p){return p.ign;})).some(function(v){return v.toLowerCase().indexOf(q)>-1;});
  });
  $('#count').textContent=squads.length+' squad'+(squads.length===1?'':'s')+(q?' ('+hit.length+' shown)':' saved');
  if(!squads.length)list.appendChild(el('div','empty','No squads yet. Tap New squad to save your team\'s names and IDs.'));
  else if(!hit.length)list.appendChild(el('div','empty','No squad or player matches "'+query.trim()+'".'));
  hit.forEach(function(s){list.appendChild(buildCard(s));});
}

/* new squad */
function newSquad(){
  var mode='squad4',s=el('div','sheet'),a=el('div','acts');
  var nf=field('Squad name','',function(){},{ph:'Team Alpha - Free Fire',nocopy:1});
  var gf=field('Game',squads.length?squads[0].game:'',function(){},{ph:'Free Fire, PUBG Mobile...',list:'games',nocopy:1});
  var ni=nf.querySelector('input'),gi=gf.querySelector('input');
  var seg=el('div','seg');
  Object.keys(MODES).forEach(function(k){
    var b=el('button',null,MODES[k].label);b.type='button';b.setAttribute('aria-pressed',String(k===mode));
    b.onclick=function(){mode=k;Array.prototype.forEach.call(seg.children,function(x){x.setAttribute('aria-pressed',String(x===b));});};
    seg.appendChild(b);
  });
  var no=el('button','btn','Cancel'),ok=el('button','btn big','Create squad');no.type=ok.type='button';
  no.onclick=closeModal;
  function create(){
    var name=ni.value.trim();
    if(!name){toast('Enter a squad name first',true);ni.focus();return;}
    squads.unshift({id:newId(),name:name,game:gi.value.trim(),mode:mode,collapsed:false,players:mkPlayers(mode)});
    save();closeModal();query='';$('#q').value='';render();window.scrollTo({top:0,behavior:'smooth'});toast('Squad created');
  }
  ok.onclick=create;
  ni.addEventListener('keydown',function(e){if(e.key==='Enter')create();});
  a.append(no,ok);
  s.append(el('h2',null,'New squad'),nf,gf,seg,a);
  modal(s);setTimeout(function(){ni.focus();},60);
}

/* export / import */
function backupJSON(){return JSON.stringify({app:'GamerVault',version:1,exportedAt:new Date().toISOString(),squads:squads},null,2);}
function exportData(){
  if(!squads.length){toast('Nothing to export yet',true);return;}
  var json=backupJSON(),name='gamervault-backup-'+new Date().toISOString().slice(0,10)+'.json';
  var s=el('div','sheet'),ta=el('textarea'),a=el('div','acts');
  ta.value=json;ta.readOnly=true;ta.rows=6;ta.setAttribute('aria-label','Backup data');
  var cp=el('button','btn big','Copy backup'),sv=el('button','btn','Save as file'),cl=el('button','btn','Close');
  cp.type=sv.type=cl.type='button';
  cp.onclick=function(){copyText(json).then(function(ok){toast(ok?'Backup copied! Paste it in Notes or WhatsApp':'Copy blocked. Select the text above and copy it.',!ok);});};
  sv.onclick=function(){
    try{
      var file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'GamerVault backup'}).catch(function(){});return;}
    }catch(e){}
    try{
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'})),l=document.createElement('a');
      l.href=url;l.download=name;document.body.appendChild(l);l.click();document.body.removeChild(l);
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      toast('Saving file. If nothing downloads, use Copy backup.');
    }catch(e){toast('Could not save a file. Use Copy backup.',true);}
  };
  cl.onclick=closeModal;a.append(sv,cl);
  s.append(el('h2',null,'Export backup'),el('p',null,'Copy this backup and keep it somewhere safe, or save it as a file.'),ta,cp,a);
  modal(s);
}
function importText(text){
  try{
    var d=JSON.parse(text),arr=Array.isArray(d)?d:(d&&d.squads);
    if(!Array.isArray(arr))throw new Error('bad');
    var got=arr.map(clean).filter(Boolean);
    if(!got.length)throw new Error('empty');
    got.forEach(function(n){var i=squads.findIndex(function(x){return x.id===n.id;});if(i>-1)squads[i]=n;else squads.push(n);});
    save();render();closeModal();toast('Imported '+got.length+' squad'+(got.length>1?'s':''));
  }catch(err){toast('That is not a valid GamerVault backup',true);}
}
function importFile(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){importText(r.result);};
  r.onerror=function(){toast('Could not read that file',true);};
  r.readAsText(f);e.target.value='';
}
function importSheet(){
  var s=el('div','sheet'),ta=el('textarea'),a=el('div','acts');
  ta.rows=6;ta.placeholder='Paste your backup code here';ta.setAttribute('aria-label','Paste backup code');
  var fb=el('button','btn','Choose file'),go=el('button','btn big','Import pasted backup'),cl=el('button','btn','Close');
  fb.type=go.type=cl.type='button';
  fb.onclick=function(){$('#file').click();};
  go.onclick=function(){if(!ta.value.trim()){toast('Paste a backup first',true);return;}importText(ta.value);};
  cl.onclick=closeModal;a.append(fb,cl);
  s.append(el('h2',null,'Import backup'),el('p',null,'Paste a backup you copied earlier, or pick a backup file. Matching squads are updated, new ones are added.'),ta,go,a);
  modal(s);
}

/* init */
$('#logo').innerHTML=svg('logo',32);
$('#sIc').innerHTML=svg('search',18);
$('#exp').innerHTML=svg('down',18)+'<span>Export</span>';
$('#imp').innerHTML=svg('up',18)+'<span>Import</span>';
$('#add').innerHTML=svg('plus',22)+'<span>New squad</span>';
$('#add').onclick=newSquad;
$('#exp').onclick=exportData;
$('#imp').onclick=importSheet;
$('#file').onchange=importFile;
$('#q').oninput=function(e){query=e.target.value;render();};
render();
})();
